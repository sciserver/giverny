# .github/workflows/publish-to-testpypi.yml
name: Publish giverny packages to TestPyPI

on:
  push:
    branches: [ceph]  # test on pushes to ceph.
  workflow_dispatch:  # allow manual test.

jobs:
  publish-to-testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      # configure TestPyPI repository for both packages.
      - name: Configure Poetry for TestPyPI
        run: |
          poetry config repositories.testpypi https://test.pypi.org/legacy/
          poetry config pypi-token.testpypi ${{ secrets.TEST_PYPI_API_TOKEN }}
      
      # build and publish giverny package to TestPyPI.
      - name: Install giverny dependencies
        run: |
          cd giverny
          poetry install --only=main --no-root
      
      - name: Build giverny package
        run: |
          cd giverny
          cp ../README.md .
          cp ../LICENSE.txt .
          poetry build
          poetry check
      
      - name: Publish giverny to TestPyPI
        run: |
          echo "Waiting 15 seconds to publish giverny on TestPyPI..."
          sleep 15
          cd giverny
          echo "Publishing giverny to TestPyPI..."
          poetry publish -r testpypi
          echo "✅ giverny published to TestPyPI"
      
      # build and publish givernylocal package to TestPyPI.
      - name: Install givernylocal dependencies
        run: |
          cd givernylocal
          poetry install --only=main --no-root
      
      - name: Build givernylocal package
        run: |
          cd givernylocal
          cp ../README.md .
          cp ../LICENSE.txt .
          poetry build
          poetry check
      
      - name: Publish givernylocal to TestPyPI
        run: |
          echo "Waiting 15 seconds to publish givernylocal on TestPyPI..."
          sleep 15
          cd givernylocal
          echo "Publishing givernylocal to TestPyPI..."
          poetry publish -r testpypi
          echo "✅ givernylocal published to TestPyPI"
      
      # test installation from TestPyPI.
      - name: Test installation from TestPyPI
        run: |
          echo "Waiting 120 seconds for packages to be available on TestPyPI..."
          sleep 120
          
          # test giverny installation.
          echo "Testing giverny installation from TestPyPI..."
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ giverny
          python -c "import giverny; print('✅ giverny import successful')" || echo "❌ giverny import failed"
          pip uninstall -y giverny
          
          # test givernylocal installation.
          echo "Testing givernylocal installation from TestPyPI..."
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ givernylocal
          python -c "import givernylocal; print('✅ givernylocal import successful')" || echo "❌ givernylocal import failed"
          pip uninstall -y givernylocal
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-dist-packages
          path: |
            giverny/dist/
            givernylocal/dist/
